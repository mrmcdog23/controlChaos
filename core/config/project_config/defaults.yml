# configurations for the context panel
context_panel:
  button_width: 45
  use_display_text: true

# configurations for shot creator
shot_creator:
  custom_naming: false

# default houdini render pool
houdini_render_pool:
  houdini

# super user modes
super_user:
  - joeleveson
  - kate
  - paul
  - alfie


# ingester commercials regex expression
commercials_shot_regex_list:
  - ^([A-Z]{3})_(sh[0-9]{3})_(.*)_v([0-9]{3}).(.*)

# ingester longform regex expression
longform_shot_regex_list:
  - ^([a-z|A-Z|0-9]{3}_[a-z|A-Z|0-9]{3})_(.*)_([0-9]+)_(.*)
  - ^([a-z|A-Z|0-9]{3}_[a-z|A-Z|0-9]{3})_(.*)_([0-9]+).cc
  - ^([a-z|A-Z|0-9]{2})_([0-9]+)_([0-9]+)_(.*)

ingest_component_names:
  - "UD_Plate"
  - "UD_STMap"
  - "RD_STMap"
  - "Wireframe"
  - "Perspective"
  - "RoundTrip"
  - "Maya"
  - "LD_Node"
  - "CameraFBX"
  - "GeoFBX"
  - "GeoABC"
  - "CameraABC"
  - "CharAnimationFBX"
  - "CharAnimationABC"
